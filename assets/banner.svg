<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Chart fill gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card glass gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
    }
    .metric-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 800;
      fill: #ffffff;
    }
    .metric-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #10b981;
    }

    /* Dynamic CSS animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: -300; }
    }
    @keyframes dotFade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .pulse-circle {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .animated-card1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .animated-card2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .chart-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 0;
      animation: dashCycle 8s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .energy-beam {
      stroke-dasharray: 20 80;
      animation: beamFlow 4s linear infinite;
    }
    .beacon-dot {
      animation: dotFade 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Background Glow Circles (Layer 0 - far behind) -->
  <circle cx="150" cy="180" r="180" fill="#3b82f6" filter="url(#glow)" opacity="0.18" class="pulse-circle" />
  <circle cx="1000" cy="100" r="160" fill="#8b5cf6" filter="url(#glow)" opacity="0.2" class="pulse-circle" style="animation-delay: -3s;" />
  <circle cx="920" cy="280" r="140" fill="#06b6d4" filter="url(#glow)" opacity="0.15" class="pulse-circle" style="animation-delay: -1.5s;" />

  <!-- Geometric Grid Accent Lines (Layer 1 - background) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Financial Chart Visual in Right Background (Layer 2) -->
  <g transform="translate(680, 80)">
    <!-- Chart Background Area Fill -->
    <path d="M 0 190 Q 70 160 130 140 T 260 110 T 370 60 T 470 20 L 470 210 L 0 210 Z" fill="url(#chartGrad)" />
    <!-- Dynamic Chart Line -->
    <path d="M 0 190 Q 70 160 130 140 T 260 110 T 370 60 T 470 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" class="chart-line" />
    <!-- Glowing Accent Beam along the chart -->
    <path d="M 0 190 Q 70 160 130 140 T 260 110 T 370 60 T 470 20" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" class="energy-beam" opacity="0.8" />

    <!-- Pulse Chart Nodes -->
    <circle cx="130" cy="140" r="4" fill="#38bdf8" />
    <circle cx="260" cy="110" r="4" fill="#38bdf8" />
    <circle cx="370" cy="60" r="5" fill="#a78bfa" />
    <circle cx="470" cy="20" r="6" fill="#34d399" filter="url(#softGlow)" class="beacon-dot" />
  </g>

  <!-- Interactive/Floating Metric Card 1 (Right Wing Top) -->
  <g class="animated-card1" transform="translate(740, 48)">
    <rect width="180" height="74" rx="12" fill="#1e293b" fill-opacity="0.82" stroke="url(#cardGrad)" stroke-width="1.5" />
    <circle cx="26" cy="37" r="15" fill="#3b82f6" fill-opacity="0.2" />
    <!-- MRR Icon -->
    <path d="M 21 42 L 21 34 M 26 42 L 26 30 M 31 42 L 31 36" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="30" class="metric-title">Monthly ARR</text>
    <text x="50" y="52" class="metric-val">$128.4k</text>
    <text x="138" y="52" class="metric-sub">+24%</text>
  </g>

  <!-- Interactive/Floating Metric Card 2 (Right Wing Bottom) -->
  <g class="animated-card2" transform="translate(930, 160)">
    <rect width="190" height="74" rx="12" fill="#1e293b" fill-opacity="0.82" stroke="url(#cardGrad)" stroke-width="1.5" />
    <circle cx="26" cy="37" r="15" fill="#10b981" fill-opacity="0.2" />
    <!-- Retention Check Icon -->
    <path d="M 20 37 L 24 41 L 32 33" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="30" class="metric-title">Net Retention</text>
    <text x="50" y="52" class="metric-val">118.5%</text>
    <text x="146" y="52" class="metric-sub">Top 5%</text>
  </g>

  <!-- Floating Metric Card 3 (Right Wing Bottom-Left) -->
  <g class="animated-card1" transform="translate(710, 215)">
    <rect width="170" height="70" rx="12" fill="#1e293b" fill-opacity="0.82" stroke="url(#cardGrad)" stroke-width="1.5" />
    <circle cx="26" cy="35" r="15" fill="#8b5cf6" fill-opacity="0.2" />
    <!-- Churn Meter Icon -->
    <path d="M 20 32 Q 26 26 32 32 M 26 35 L 29 32" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="28" class="metric-title">Logo Churn</text>
    <text x="50" y="50" class="metric-val">0.8%</text>
    <text x="108" y="50" class="metric-sub" fill="#10b981">Optimal</text>
  </g>

  <!-- Foreground Content: Header, Badges, Title & Subtitle (Layer 3 - NEVER hidden) -->
  <!-- Category Pill / Badge -->
  <g transform="translate(70, 52)">
    <rect width="250" height="30" rx="15" fill="#1e293b" stroke="url(#cyanBlueGrad)" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#10b981" class="beacon-dot" />
    <text x="30" y="20" class="badge-text" fill="#38bdf8">FINANCIAL INTELLIGENCE</text>
    <text x="195" y="20" class="badge-text" fill="#94a3b8">· 2026</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="142" class="title-text" font-size="44">Awesome SaaS &amp;</text>
  <text x="70" y="196" class="title-text" font-size="44" fill="url(#cyanBlueGrad)">Subscription Analytics</text>

  <!-- Subtitle -->
  <text x="70" y="238" class="subtitle-text" font-size="16">Curated Directory of Open-Source Engines &amp; Enterprise Platforms</text>
  <text x="70" y="262" class="subtitle-text" font-size="14" fill="#64748b">Track MRR · ARR Waterfall · Cohort Retention · Net Revenue Retention · Churn</text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(70, 292)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="132" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">📈 MRR &amp; ARR</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="144" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="156" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">🔄 Churn Analysis</text>

    <!-- Pill 3 -->
    <rect x="296" y="0" width="138" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="310" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">⚡ Self-Hosted</text>

    <!-- Pill 4 -->
    <rect x="444" y="0" width="148" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="458" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f59e0b">📊 Billing Engines</text>
  </g>
</svg>
